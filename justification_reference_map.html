.edit-form label{display:block;font-size:11px;font-weight:600;color:#555;margin:6px 0 2px}
.edit-form input,.edit-form textarea,.edit-form select{width:100%;font-size:12px;padding:3px 6px;

.edit-form .del-btn{margin-top:4px;padding:3px 10px;font-size:11.5px;cursor:pointer;

  {n:'Observatory Point', lat:48.151, lon:-123.637, cat:'rip',

// build marker layers per category
const layers = {};
for(const [k,v] of Object.entries(CATS)) layers[k] = L.layerGroup().addTo(map);

function makeIcon(cat){
  const c = CATS[cat];
  return L.divIcon({
    className:'',
    iconSize:[26,26],
    iconAnchor:[13,13],
    popupAnchor:[0,-15],
    html:`<div class="marker-icon" style="background:${c.color}">${c.icon}</div>`
  });
}

let editMode = false;
const markers = [];

// Persist marker edits in localStorage
const STORAGE_KEY = 'justif_refmap_edits_v2';
const USER_MARKERS_KEY = 'justif_refmap_user_markers';

function loadSavedEdits(){
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(!saved) return;
    saved.forEach((s,i)=>{
      if(i<PLACES.length && s){
        PLACES[i].n=s.n; PLACES[i].lat=s.lat; PLACES[i].lon=s.lon;
        PLACES[i].cat=s.cat; PLACES[i].ctx=s.ctx; PLACES[i].sec=s.sec;
      }
    });
  } catch(e){}
}
function saveEdits(){
  try {
    const builtIn = PLACES.filter(p=>!p._user);
    const edits = builtIn.map(p=>({n:p.n, lat:p.lat, lon:p.lon, cat:p.cat, ctx:p.ctx, sec:p.sec}));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
  } catch(e){}
}
function clearEdits(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(USER_MARKERS_KEY);
  location.reload();
}

function loadUserMarkers(){
  try {
    const saved = JSON.parse(localStorage.getItem(USER_MARKERS_KEY));
    if(!saved) return;
    saved.forEach(um => addUserMarker(um, false));
  } catch(e){}
}
function saveUserMarkers(){
  try {
    const ums = PLACES.filter(p => p._user).map(p => ({
      n:p.n, lat:p.lat, lon:p.lon, cat:p.cat, ctx:p.ctx, sec:p.sec
    }));
    localStorage.setItem(USER_MARKERS_KEY, JSON.stringify(ums));
  } catch(e){}
}
function addUserMarker(p, save){
  p._user = true;
  PLACES.push(p);
  const c = CATS[p.cat];
  const mIdx = markers.length;
  const m = L.marker([p.lat,p.lon],{icon:makeIcon(p.cat), zIndexOffset:c.z, draggable:editMode})
    .bindPopup(popupHTML(p,c,mIdx),{maxWidth:340})
    .addTo(layers[p.cat]);
  m._placeData = p;
  m._mIdx = mIdx;
  m.on('dragend',function(){
    const ll = m.getLatLng();
    p.lat = Math.round(ll.lat*1000)/1000;
    p.lon = Math.round(ll.lng*1000)/1000;
    m.setPopupContent(popupHTML(p,c,m._mIdx));
    m.openPopup();
    saveUserMarkers();
  });
  markers.push(m);
  if(save) saveUserMarkers();
  return m;
}

loadSavedEdits();
loadUserMarkers();

function popupHTML(p, c, mIdx){
  if(!editMode){
    return `
      <div class="cat" style="background:${c.color}">${c.label.toUpperCase()}${p._user?' · USER-ADDED':''}</div>
      <h3>${p.n}</h3>
      <div class="ctx">${p.ctx||'<i style="color:#aaa">No comment</i>'}</div>
      <div class="sec">${p.sec||'User-added'}</div>`;
  }
  const catOpts = Object.entries(CATS).map(([k,v])=>
    `<option value="${k}"${k===p.cat?' selected':''}>${v.label}</option>`).join('');
  const esc = s=>(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  return `<div class="edit-form">
    <label>Name</label>
    <input id="ef_n" value="${esc(p.n)}">
    <label>Category</label>
    <select id="ef_cat">${catOpts}</select>
    <div class="coord-row">
      <div><label>Lat</label><input id="ef_lat" type="number" step="0.001" value="${p.lat.toFixed(3)}"></div>
      <div><label>Lon</label><input id="ef_lon" type="number" step="0.001" value="${p.lon.toFixed(3)}"></div>
    </div>
    <label>Context</label>
    <textarea id="ef_ctx" rows="3">${esc(p.ctx)}</textarea>
    <label>Section ref</label>
    <input id="ef_sec" value="${esc(p.sec)}">
    <button class="save-btn" onclick="applyEdit(${mIdx})">Save changes</button>
    ${p._user?`<button class="del-btn" onclick="deleteUserMarker('${p.n.replace(/'/g,"\\'")}')">Remove marker</button>`:''}
  </div>`;
}

function applyEdit(mIdx){
  const m = markers[mIdx];
  const p = m._placeData;
  const oldCat = p.cat;
  p.n   = document.getElementById('ef_n').value.trim() || p.n;
  p.cat = document.getElementById('ef_cat').value;
  p.lat = parseFloat(document.getElementById('ef_lat').value) || p.lat;
  p.lon = parseFloat(document.getElementById('ef_lon').value) || p.lon;
  p.ctx = document.getElementById('ef_ctx').value.trim();
  p.sec = document.getElementById('ef_sec').value.trim();
  m.setLatLng([p.lat, p.lon]);
  if(p.cat !== oldCat){
    layers[oldCat].removeLayer(m);
    m.setIcon(makeIcon(p.cat));
    m.setZIndexOffset(CATS[p.cat].z);
    layers[p.cat].addLayer(m);
    updateLegendCounts();
  }
  const c = CATS[p.cat];
  m.setPopupContent(popupHTML(p, c, mIdx));
  saveEdits(); saveUserMarkers();
}

PLACES.forEach((p,i)=>{
  if(p._user) return;
  const c = CATS[p.cat];
  const mIdx = markers.length;
  const m = L.marker([p.lat,p.lon],{icon:makeIcon(p.cat), zIndexOffset:c.z, draggable:false})
    .bindPopup(popupHTML(p,c,mIdx),{maxWidth:340})
    .addTo(layers[p.cat]);
  m._placeData = p;
  m._mIdx = mIdx;
  m.on('dragend',function(){
    const ll = m.getLatLng();
    p.lat = Math.round(ll.lat*1000)/1000;
    p.lon = Math.round(ll.lng*1000)/1000;
    m.setPopupContent(popupHTML(p,c,m._mIdx));
    m.openPopup();
    saveEdits();
  });
  markers.push(m);
});

function deleteUserMarker(name){
  const idx = PLACES.findIndex(p=>p._user && p.n===name);
  if(idx<0) return;
  PLACES.splice(idx,1);
  const mi = markers.findIndex(m=>m._placeData && m._placeData._user && m._placeData.n===name);
  if(mi>=0){
    map.removeLayer(markers[mi]);
    markers.splice(mi,1);
  }
  saveUserMarkers();
  updateLegendCounts();
}

function toggleEdit(){
  editMode = !editMode;
  markers.forEach((m,i)=>{
    if(m.dragging) m.dragging[editMode?'enable':'disable']();
    const p = m._placeData;
    const c = CATS[p.cat];
    m.setPopupContent(popupHTML(p,c,i));
  });
  if(!editMode){ saveEdits(); saveUserMarkers(); }
  document.getElementById('editBtn').textContent = editMode ? '✓ Done editing' : '✎ Edit markers';
  document.getElementById('exportBtn').style.display = editMode ? 'block' : 'none';
  document.getElementById('deployBtn').style.display = editMode ? 'block' : 'none';
  document.getElementById('resetBtn').style.display = editMode ? 'block' : 'none';
  const hint = document.getElementById('editHint');
  if(hint) hint.style.display = editMode ? 'block' : 'none';
}

map.on('layeradd',function(e){
  if(!editMode) return;
  e.layer.eachLayer && e.layer.eachLayer(function(m){
    if(m.dragging) m.dragging.enable();
  });
});

let addOverlay = null;
function showAddForm(lat, lon){
  if(addOverlay) addOverlay.remove();
  const catOpts = Object.entries(CATS).map(([k,v])=>
    `<option value="${k}"${k==='rip'?' selected':''}>${v.label}</option>`).join('');
  const div = document.createElement('div');
  div.id = 'addOverlay';
  div.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;'+
    'background:#fff;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.35);padding:16px 20px;'+
    'width:320px;font-family:system-ui,sans-serif;font-size:13px';
  div.innerHTML = `<h4 style="margin:0 0 10px;font-size:14px">Add marker at ${lat}, ${lon}</h4>
    <div class="edit-form">
      <label>Name</label><input id="af_n" placeholder="e.g. Ripple Point">
      <label>Category</label><select id="af_cat">${catOpts}</select>
      <label>Context</label><textarea id="af_ctx" rows="2" placeholder="Source or description"></textarea>
      <label>Section ref</label><input id="af_sec" placeholder="e.g. Coast Pilot §33">
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="save-btn" style="flex:1" onclick="submitAddForm(${lat},${lon})">Add</button>
        <button style="flex:1;padding:4px 12px;font-size:12px;cursor:pointer;border:1px solid #aaa;border-radius:4px;background:#f5f5f5" onclick="closeAddForm()">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  addOverlay = div;
  document.getElementById('af_n').focus();
}
function closeAddForm(){ if(addOverlay){addOverlay.remove();addOverlay=null;} }
function submitAddForm(lat,lon){
  const name = document.getElementById('af_n').value.trim();
  if(!name){ document.getElementById('af_n').style.borderColor='#c33'; return; }
  const p = {n:name, lat:lat, lon:lon,
    cat:document.getElementById('af_cat').value,
    ctx:document.getElementById('af_ctx').value.trim(),
    sec:document.getElementById('af_sec').value.trim() || 'User-added'};
  closeAddForm();
  const m = addUserMarker(p, true);
  m.openPopup();
  updateLegendCounts();
}

map.on('click',function(e){
  if(!editMode) return;
  const lat = Math.round(e.latlng.lat*1000)/1000;
  const lon = Math.round(e.latlng.lng*1000)/1000;
  showAddForm(lat, lon);
});

function exportCoords(){
  let out = '// Updated coordinates — paste into PLACES array\n';
  PLACES.filter(p=>!p._user).forEach(p=>{
    out += `  {n:'${p.n}', lat:${p.lat.toFixed(3)}, lon:${p.lon.toFixed(3)}},\n`;
  });
  const userPts = PLACES.filter(p=>p._user);
  if(userPts.length){
    out += '\n// ── User-added markers ──\n';
    userPts.forEach(p=>{
      out += `  {n:'${p.n.replace(/'/g,"\\'")}', lat:${p.lat.toFixed(3)}, lon:${p.lon.toFixed(3)}, cat:'${p.cat}',\n`;
      out += `   ctx:'${(p.ctx||'').replace(/'/g,"\\'")}',\n`;
      out += `   sec:'${(p.sec||'').replace(/'/g,"\\'")}'},\n`;
    });
  }
  console.log(out);
  const ta = document.createElement('textarea');
  ta.value = out;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  alert((userPts.length ? userPts.length+' user-added + ' : '') + 'all coordinates copied to clipboard and logged to console.');
}

function deployExport(){
  const all = PLACES.map(p => ({
    n: p.n,
    lat: Math.round(p.lat * 1000) / 1000,
    lon: Math.round(p.lon * 1000) / 1000,
    cat: p.cat || 'place',
    ctx: p.ctx || '',
    sec: p.sec || ''
  }));
  const json = JSON.stringify(all, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'places_update.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert(all.length + ' markers exported to places_update.json\n\nRun deploy_ref_map.command to update the source file.');
}

function updateLegendCounts(){
  document.querySelectorAll('.legend-item').forEach(el=>{
    const k = el.dataset.cat;
    if(!k) return;
    const count = PLACES.filter(p=>p.cat===k).length;
    const v = CATS[k];
    el.innerHTML = `<span class="legend-dot" style="background:${v.color}"></span>${v.label} (${count})`;
  });
}

// ── Legend ──
const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = '<h4>Justification Doc — Reference Map</h4>';
  for(const [k,v] of Object.entries(CATS)){
    const count = PLACES.filter(p=>p.cat===k).length;
    const el = L.DomUtil.create('div','legend-item',div);
    el.dataset.cat = k;
    el.innerHTML = `<span class="legend-dot" style="background:${v.color}"></span>${v.label} (${count})`;
    el.addEventListener('click',function(){
      this.classList.toggle('off');
      if(this.classList.contains('off')) map.removeLayer(layers[k]);
      else map.addLayer(layers[k]);
    });
  }
  const note = L.DomUtil.create('div','',div);
  note.style.cssText = 'font-size:10.5px;color:#888;margin-top:8px;border-top:1px solid #ddd;padding-top:6px';
  note.textContent = 'Click a category to toggle. Click a marker for context.';

  const editBtn = L.DomUtil.create('button','',div);
  editBtn.id = 'editBtn';
  editBtn.textContent = '✎ Edit markers';
  editBtn.style.cssText = 'display:block;margin-top:8px;padding:4px 10px;font-size:12px;cursor:pointer;border:1px solid #aaa;border-radius:4px;background:#f8f8f8;width:100%';
  editBtn.addEventListener('click',function(e){e.stopPropagation();toggleEdit();});

  const exportBtn = L.DomUtil.create('button','',div);
  exportBtn.id = 'exportBtn';
  exportBtn.textContent = '📋 Copy coordinates';
  exportBtn.style.cssText = 'display:none;margin-top:4px;padding:4px 10px;font-size:12px;cursor:pointer;border:1px solid #aaa;border-radius:4px;background:#e8f4e8;width:100%';
  exportBtn.addEventListener('click',function(e){e.stopPropagation();exportCoords();});

  const deployBtn = L.DomUtil.create('button','',div);
  deployBtn.id = 'deployBtn';
  deployBtn.textContent = '🚀 Export for deploy';
  deployBtn.style.cssText = 'display:none;margin-top:4px;padding:4px 10px;font-size:12px;cursor:pointer;border:1px solid #aaa;border-radius:4px;background:#e8e8f4;width:100%';
  deployBtn.addEventListener('click',function(e){e.stopPropagation();deployExport();});

  const resetBtn = L.DomUtil.create('button','',div);
  resetBtn.id = 'resetBtn';
  resetBtn.textContent = '↺ Reset to defaults';
  resetBtn.style.cssText = 'display:none;margin-top:4px;padding:4px 10px;font-size:12px;cursor:pointer;border:1px solid #aaa;border-radius:4px;background:#fce8e8;width:100%';
  resetBtn.addEventListener('click',function(e){e.stopPropagation();if(confirm('Discard all position edits and user-added markers?'))clearEdits();});

  const editHint = L.DomUtil.create('div','',div);
  editHint.id = 'editHint';
  editHint.style.cssText = 'display:none;margin-top:6px;padding:5px 8px;background:#fff3cd;border:1px solid #eda100;border-radius:4px;font-size:11px;color:#856404;line-height:1.45';
  editHint.textContent = 'Click a marker to edit all fields. Drag to reposition. Click the map to add a new marker.';

  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);
</script>
