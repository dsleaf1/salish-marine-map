  return L.divIcon({
    className:'',
    iconSize:[26,26],
    iconAnchor:[13,13],
    popupAnchor:[0,-15],
    html:`<div class="marker-icon" style="background:${c.color}">${c.icon}</div>`
  });
}

function popupHTML(p, c){
  return `
    <div class="cat" style="background:${c.color}">${c.label.toUpperCase()}</div>
    <h3>${p.n}</h3>
    <div class="ctx">${p.ctx||'<i style="color:#aaa">No comment</i>'}</div>
    <div class="sec">${p.sec||''}</div>`;
}

PLACES.forEach(p=>{
  const c = CATS[p.cat];
  L.marker([p.lat,p.lon],{icon:makeIcon(p.cat), zIndexOffset:c.z})
    .bindPopup(popupHTML(p,c),{maxWidth:340})
    .addTo(layers[p.cat]);
});

// ── Legend ──
const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = '<h4>Justification Doc — Reference Map</h4>';
  for(const [k,v] of Object.entries(CATS)){
    const count = PLACES.filter(p=>p.cat===k).length;
    const el = L.DomUtil.create('div','legend-item',div);
    el.innerHTML = `<span class="legend-dot" style="background:${v.color}"></span>${v.label} (${count})`;
    el.addEventListener('click',function(){
      this.classList.toggle('off');
      if(this.classList.contains('off')) map.removeLayer(layers[k]);
      else map.addLayer(layers[k]);
    });
  }
  const note = L.DomUtil.create('div','',div);
  note.style.cssText = 'font-size:10.5px;color:#888;margin-top:8px;border-top:1px solid #ddd;padding-top:6px';
  note.textContent = 'Click a category to toggle. Click a marker for context.';
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
